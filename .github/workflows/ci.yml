name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.os }} - GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc: 9.2.8
          - os: ubuntu-latest
            ghc: 9.6.7
          - os: macos-latest
            ghc: 9.6.7
          - os: windows-latest
            ghc: 9.6.7

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Install native dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsnappy-dev pkg-config protobuf-compiler

      - name: Install native dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install pkgconf protobuf snappy
          snappy_prefix="$(brew --prefix snappy)"
          printf '%s\n' \
            'package snappy-c' \
            "  extra-include-dirs: $snappy_prefix/include" \
            "  extra-lib-dirs: $snappy_prefix/lib" \
            > cabal.project.local

      - name: Install native dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
            mingw-w64-ucrt-x86_64-pkgconf `
            mingw-w64-ucrt-x86_64-protobuf `
            mingw-w64-ucrt-x86_64-snappy
          Add-Content $env:GITHUB_PATH "C:\msys64\ucrt64\bin"
          Add-Content $env:GITHUB_ENV `
            "PKG_CONFIG_PATH=C:/msys64/ucrt64/lib/pkgconfig"
          @(
            "package snappy-c"
            "  extra-include-dirs: C:/msys64/ucrt64/include"
            "  extra-lib-dirs: C:/msys64/ucrt64/lib"
          ) | Set-Content cabal.project.local

      - name: Check Protocol Buffers compiler
        run: protoc --version

      - name: Cache Cabal packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.local') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-

      - name: Check package metadata
        run: cabal check

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --test-show-details=direct
